<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification</title>
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
</head>

<body>
    <header>
        <h1>Signova</h1>
        <nav>
            <a href="{{ url_for('contact')}}">Contact us</a>
            <a href="{{ url_for('about')}}">About us</a>
        </nav>
    </header>
    <div>
        <button type="button" class="back" onclick="history.back()">
            ← Back
        </button>
        <h2>Verify OTP</h2>
    </div>
    <form method="POST" action="{{ url_for('verify_otp') }}">
        <div>
            <label for="otp">Enter 6-digit Verification Code</label>
            <input type="text" id="otp" name="otp" pattern=[0-9]{6} maxlength="6" placeholder="Enter OTP" required>
        </div>
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
        {% endwith %}
        <button type="submit">Verfiy OTP</button>
    </form>
</body>

</html>
